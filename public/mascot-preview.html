<!DOCTYPE html>
<!--
  DEV-ONLY showcase — not linked from the real app, not shipped to students.
  Purpose: inspect every Qiyas mascot state at every size token together
  before wiring the SVG into companion.js and every screen that uses it.
  Delete or leave unlinked once the mascot is approved and integrated.
-->
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<title>Qiyas mascot — state/size showcase (dev only)</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  body { display: block; background: #F4F6F8; font-family: 'IBM Plex Sans', sans-serif; padding: 32px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--text-muted); margin: 0 0 28px; font-size: 13.5px; }
  .surface-toggle { display: flex; gap: 8px; margin-bottom: 24px; }
  .surface-toggle button { border: 1.5px solid var(--line); background: white; border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
  .surface-toggle button.active { border-color: var(--accent); background: var(--accent-tint); }
  table { border-collapse: collapse; width: 100%; background: white; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-sm); }
  th, td { padding: 14px; text-align: center; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { background: var(--paper-dim); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); }
  td:first-child, th:first-child { text-align: left; font-weight: 600; font-size: 12.5px; color: var(--ink); padding-left: 18px; }
  .cell { display: inline-flex; align-items: center; justify-content: center; }
  .dark-surface td { background: #12213B; }
  .dark-surface td:first-child { color: white; }
  .big-row { display: flex; gap: 40px; margin-top: 40px; align-items: flex-end; flex-wrap: wrap; }
  .big-row .cell-label { font-size: 12px; color: var(--text-muted); text-align: center; margin-top: 8px; }
  .big-cell { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>
  <h1>Qiyas — Compass-Star Beacon</h1>
  <p class="sub">Every state × every size token, on both light and dark surfaces. Inspect here before wiring into companion.js.</p>

  <table id="grid"></table>

  <h1 style="margin-top:40px;">Large sizes (onboarding / celebration) on white</h1>
  <div class="big-row" id="bigRow" style="background: #fff; padding: 40px; border-radius: 16px; border: 1px solid var(--line);"></div>

  <h1 style="margin-top:40px;">Contrast check — on the brand gradient itself (hero/mission-header context)</h1>
  <div class="big-row" id="gradRow" style="background: linear-gradient(135deg,#1E3A8A,#14B8A6); padding: 40px; border-radius: 16px;"></div>

<script>
const STATES = ['idle','blink','looking','thinking','encouraging','happy','celebrating','concerned','pointing','success'];
const SIZES = [
  { key: 'xs', px: 20, label: 'XS 20' },
  { key: 'sm', px: 32, label: 'SM 32' },
  { key: 'md', px: 56, label: 'MD 56' },
  { key: 'lg', px: 96, label: 'LG 96' },
];

let uid = 0;

// ---- Qiyas SVG builder (this exact function body ports verbatim into
// companion.js's mascotMarkup() once approved) ----
function qiyasSVG() {
  const id = `qiyas${uid++}`;
  return `
    <svg viewBox="0 0 64 64" class="qiyas-svg" aria-hidden="true">
      <defs>
        <linearGradient id="grad${id}" x1="8%" y1="4%" x2="92%" y2="96%">
          <stop offset="0%" stop-color="#1E3A8A"/>
          <stop offset="100%" stop-color="#14B8A6"/>
        </linearGradient>
        <radialGradient id="glow${id}" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.5"/>
          <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle class="qiyas-glow" cx="32" cy="32" r="31" fill="url(#glow${id})"/>
      <circle class="qiyas-ring" cx="32" cy="32" r="28.5" fill="none" stroke="#14B8A6" stroke-width="2"/>
      <g class="qiyas-float">
        <g class="qiyas-body-group">
          <path class="qiyas-body" fill="url(#grad${id})" d="
            M28.02 13.72
            Q32 6 35.98 13.72
            L38.01 17.67
            Q40.84 23.16 46.33 25.99
            L50.28 28.02
            Q58 32 50.28 35.98
            L46.33 38.01
            Q40.84 40.84 38.01 46.33
            L35.98 50.28
            Q32 58 28.02 50.28
            L25.99 46.33
            Q23.16 40.84 17.67 38.01
            L13.72 35.98
            Q6 32 13.72 28.02
            L17.67 25.99
            Q23.16 23.16 25.99 17.67
            L28.02 13.72 Z"/>
          <g class="qiyas-eyes">
            <rect class="qiyas-eye qiyas-eye-l" x="26.85" y="26.2" width="2.9" height="7.6" rx="1.45"/>
            <rect class="qiyas-eye qiyas-eye-r" x="34.25" y="26.2" width="2.9" height="7.6" rx="1.45"/>
          </g>
        </g>
      </g>
      <path class="qiyas-sparkle qiyas-sparkle-1" fill="#14B8A6" stroke="#fff" stroke-width="1" stroke-linejoin="round"
        d="M49 9 L50.5 13.2 L54.5 14.8 L50.5 16.4 L49 20.6 L47.5 16.4 L43.5 14.8 L47.5 13.2 Z"/>
      <path class="qiyas-sparkle qiyas-sparkle-2" fill="#14B8A6" stroke="#fff" stroke-width="0.8" stroke-linejoin="round"
        d="M15 44 L16 46.6 L18.6 47.6 L16 48.6 L15 51.2 L14 48.6 L11.4 47.6 L14 46.6 Z"/>
    </svg>`;
}

function buildMascot(state, sizePx) {
  const wrap = document.createElement('div');
  wrap.className = `qiyas-mascot qiyas-anim-${state}`;
  wrap.style.width = sizePx + 'px';
  wrap.style.height = sizePx + 'px';
  wrap.innerHTML = qiyasSVG();
  return wrap;
}

// ---- build the grid ----
const table = document.getElementById('grid');
let thead = '<tr><th>state</th>' + SIZES.map(s => `<th>${s.label}</th>`).join('') + '</tr>';
table.innerHTML = thead;
STATES.forEach((state) => {
  const tr = document.createElement('tr');
  const th = document.createElement('td');
  th.textContent = state;
  tr.appendChild(th);
  SIZES.forEach((size) => {
    const td = document.createElement('td');
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.appendChild(buildMascot(state, size.px));
    td.appendChild(cell);
    tr.appendChild(td);
  });
  table.appendChild(tr);
});

// dark surface duplicate row set for celebrating/success/idle (checked on brand gradient below instead)
const bigRow = document.getElementById('bigRow');
['idle','encouraging','happy','celebrating','success','thinking','concerned','pointing'].forEach((state) => {
  const cell = document.createElement('div');
  cell.className = 'big-cell';
  cell.appendChild(buildMascot(state, 144));
  const label = document.createElement('div');
  label.className = 'cell-label';
  label.textContent = state + ' · XL 144';
  cell.appendChild(label);
  bigRow.appendChild(cell);
});

const gradRow = document.getElementById('gradRow');
['idle','happy','celebrating','concerned'].forEach((state) => {
  const cell = document.createElement('div');
  cell.className = 'big-cell';
  cell.appendChild(buildMascot(state, 120));
  const label = document.createElement('div');
  label.className = 'cell-label';
  label.style.color = 'white';
  label.textContent = state;
  cell.appendChild(label);
  gradRow.appendChild(cell);
});
</script>
</body>
</html>
